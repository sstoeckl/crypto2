# Weekly check that every data source crypto2 depends on still answers with
# the expected shape. A failed run (endpoint gone or schema changed) emails
# the maintainer; machine-specific refusals (Cloudflare, 429) only warn.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: endpoint-check

permissions: read-all

jobs:
  endpoint-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TZ: 'UTC'
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::arrow
          needs: check

      - name: Check data sources
        run: Rscript .github/scripts/check_endpoints.R
